name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gbdt]"
      - name: Lint
        run: ruff check src tests experiments
      - name: Unit and property tests
        run: pytest tests -q --durations=10
      - name: End-to-end smoke run
        run: |
          PYTHONPATH=src python experiments/run_all.py \
            --config configs/smoke.yaml --sweep-config configs/smoke.yaml \
            --out-dir results/smoke --docs-dir results/smoke/docs
      - name: Check the smoke run produced its artefacts
        run: |
          test -s results/smoke/cycles.csv
          test -s results/smoke/summary.csv
          test -s results/smoke/docs/figures/recall_trajectories.png
          test -s results/smoke/docs/RESULTS.md
          # The committed report must be untouched by a throwaway run.
          git diff --exit-code -- docs/
