# The headline experiment with a deliberately wrong belief about what an action achieves.
#
# `rho` is the one input no observational log identifies: nothing in an extract of orders that
# were never intervened on says what a nudge would have done. The headline config uses the value
# a well-run uplift experiment on this population would report. This one believes an escalation
# is half again as effective as it is, which is the direction optimism actually runs in.
#
# `experiments/run_all.py --only sensitivity` sweeps the belief continuously; this file exists so
# `drisk policy configs/uplift_sensitivity.yaml` shows a single wrong-belief run end to end.
name: uplift_optimistic
description: Headline setup, with the policy believing interventions are 1.5x more effective.
output_dir: results/uplift_optimistic
seed: 7

data:
  source: synthetic
  database_url: sqlite:///data/deliveryrisk.db
  synthetic: {n_orders: 99441, n_unique_customers: 96096, n_sellers: 3095, n_products: 32951, span_days: 730, seed: 7}

features: {mode: point_in_time, trailing_days: 30.0, prior_weight: 15.0}
split: {train_share: 0.6, valid_share: 0.15}
model: {kind: gbdt, n_estimators: 1200, learning_rate: 0.03, num_leaves: 15, min_child_samples: 80, seed: 13}
calibration: {method: isotonic, n_bins: 20}
economics: {support_cost: 4.50, voucher_prob: 0.22, voucher_share: 0.12, churn_per_bad_review: 0.35, repeat_horizon_orders: 2.5}
actions: {nudge_cost: 1.20, expedite_multiplier: 1.0, expedite_weight_rate: 0.05}
uplift: {rho_nudge: 0.69, rho_expedite: 1.0}
policies: {fixed_rates: [0.10, 0.20], budget_share: 0.5, budget_grid: [0.1, 0.25, 0.5, 1.0]}
