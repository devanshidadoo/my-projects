# The experiment every number in docs/RESULTS.md and the README comes from.
#
# Scale and marginals track the Olist Brazilian e-commerce release (99,441 orders, 112,650 order
# items, 3,095 sellers, 32,951 products, 96,096 unique customers) so the generated warehouse can
# be checked against a public reference rather than taken on trust. See docs/METHODOLOGY.md §2.
name: headline
description: >
  100K-order warehouse, point-in-time features over nine tables, calibrated risk and cause
  models, and every decision rule from a decile heuristic to a budget-constrained
  margin-optimised assignment.
output_dir: results/headline
seed: 7

data:
  source: synthetic
  database_url: sqlite:///data/deliveryrisk.db
  synthetic:
    n_orders: 99441
    n_unique_customers: 96096
    n_sellers: 3095
    n_products: 32951
    span_days: 730
    seed: 7

features:
  mode: point_in_time
  trailing_days: 30.0
  prior_weight: 15.0
  # prior_rate is left unset: it is computed from the training window only.

split: {train_share: 0.6, valid_share: 0.15}

model:
  kind: gbdt
  n_estimators: 1200
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 80
  seed: 13

calibration: {method: isotonic, n_bins: 20}

# Every constant below is an assumption with a name; docs/METHODOLOGY.md §5 argues each one.
economics:
  support_cost: 4.50
  voucher_prob: 0.22
  voucher_share: 0.12
  churn_per_bad_review: 0.35
  repeat_horizon_orders: 2.5

actions:
  nudge_cost: 1.20
  expedite_multiplier: 1.0
  expedite_weight_rate: 0.05

# What the policy *believes* an action achieves. Swept in configs/uplift_sensitivity.yaml,
# because this is the one input no observational log identifies.
uplift: {rho_nudge: 0.46, rho_expedite: 0.71}

policies:
  fixed_rates: [0.10, 0.20]
  budget_share: 0.5
  budget_grid: [0.05, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0, 1.5]

# Published marginals of the reference dataset, for the calibration table in RESULTS §1.
calibration_reference:
  n_orders: 99441
  n_order_items: 112650
  n_sellers: 3095
  n_products: 32951
  n_customers_unique: 96096
  items_per_order: 1.133
  mean_price: 120.65
  median_price: 74.99
  mean_freight: 19.99
  mean_payment_value: 154.10
  mean_review_score: 4.09
  late_share_delivered: 0.079
  mean_delivery_days: 12.1
  mean_promise_days: 23.5
